name: Generate Stats Card

# Redesenha stats-dark.svg / stats-light.svg com os numeros do dia.


on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gera os cards
        env:
          
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_stats.py

      - name: Commita se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-dark.svg stats-light.svg
          git diff --quiet --cached && echo "sem mudanca" && exit 0
          git commit -m "chore: atualiza card de estatisticas"
          git push
